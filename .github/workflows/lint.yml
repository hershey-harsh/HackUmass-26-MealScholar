# Runs Ruff lint (rules in pyproject.toml [tool.ruff]) and the Ruff formatter check on every pull
# request and push to main. Keep the version in sync with the commands in README.md.
name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.5"
          args: check --output-format github

      # Runs even when the lint step fails, so one push shows both kinds of findings.
      # Fix locally with `uvx ruff@0.17.5 format`.
      - uses: astral-sh/ruff-action@v4.1.0
        if: success() || failure()
        with:
          version: "0.17.5"
          args: format --check --diff
