[project]
name = "umass-cams"
version = "0.1.0"
description = "Busy / not-busy predictor for UMass dining halls from the public dining-room webcams (people counts only, no images stored)."
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pymongo>=4.8",
    "playwright==1.65.2",
    "python-dotenv>=1.0",
    "lap>=0.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
umass-cams-sample = "umass_cams.sample:main"
umass-cams-demo = "umass_cams.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["umass_cams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # test this checkout, not the copy the service venv points at
