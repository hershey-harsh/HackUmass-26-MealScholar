# Runs the test suite on every pull request and push to main. The tests build their own fixture
# USDA database and fake Gemini, Nominatim and the dining menus, so the job needs no secrets and
# makes no API calls. The MongoDB store tests run only when FOODSMART_TEST_MONGODB_URI is set.
# Local equivalent: uv run pytest
name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uv sync --locked

      - run: uv run pytest
